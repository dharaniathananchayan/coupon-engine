services:
  - type: web
    name: promo-coupon-engine
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m scripts.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: promo-db
          property: connectionString

databases:
  - name: promo-db
    databaseName: promo_coupon_engine
    user: promo_user
    plan: free
