<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ArchintX Coupon Engine{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef8ff',
                            100: '#d9efff',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="min-h-full flex flex-col text-slate-800 antialiased font-sans">
    <!-- Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Brand / Logo -->
                <div class="flex items-center space-x-3">
                    <a href="/" class="flex items-center space-x-2.5 group">
                        <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-sky-600 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-sky-500/20 group-hover:scale-105 transition-transform">
                            <i class="fa-solid fa-ticket text-lg"></i>
                        </div>
                        <div>
                            <span class="text-xl font-bold tracking-tight text-slate-900">Archint<span class="text-sky-600">X</span></span>
                            <span class="text-xs block text-slate-500 font-medium -mt-1 tracking-wide uppercase">Coupon Engine</span>
                        </div>
                    </a>
                </div>

                <!-- Navigation Links -->
                <nav class="flex items-center space-x-2 sm:space-x-4">
                    <a href="/apply" class="px-3.5 py-2 text-sm font-medium rounded-lg transition-colors {% if active_page == 'apply' %}bg-sky-50 text-sky-700 font-semibold{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                        <i class="fa-solid fa-tag mr-1.5 opacity-70"></i> Apply Coupon
                    </a>
                    
                    {% if is_authenticated %}
                    <a href="/dashboard" class="px-3.5 py-2 text-sm font-medium rounded-lg transition-colors {% if active_page == 'dashboard' %}bg-sky-50 text-sky-700 font-semibold{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                        <i class="fa-solid fa-gauge mr-1.5 opacity-70"></i> Dashboard
                    </a>
                    <button onclick="handleLogout()" class="px-3 py-1.5 text-sm font-medium rounded-lg text-rose-600 hover:bg-rose-50 transition-colors border border-rose-200">
                        <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> Logout
                    </button>
                    {% else %}
                    <a href="/login" class="px-4 py-2 text-sm font-medium rounded-lg transition-all {% if active_page == 'login' %}bg-slate-900 text-white shadow-sm{% else %}bg-slate-900 text-white hover:bg-slate-800 shadow-sm hover:shadow{% endif %}">
                        <i class="fa-solid fa-lock mr-1.5 text-xs text-sky-400"></i> Staff Login
                    </a>
                    {% endif %}
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-12 text-center text-sm text-slate-500">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div>
                <span class="font-semibold text-slate-700">ArchintX Capstone Project</span> &bull; Production Coupon Engine
            </div>
            <div class="flex items-center space-x-4 text-xs text-slate-400">
                <span>Rules strictly enforced server-side</span>
                <span>&bull;</span>
                <span>Atomic Concurrency Safe</span>
                <span>&bull;</span>
                <a href="/docs" target="_blank" class="text-sky-600 hover:underline">API Docs (Swagger)</a>
            </div>
        </div>
    </footer>

    <script>
        async function handleLogout() {
            try {
                await fetch('/auth/logout', { method: 'POST' });
                window.location.href = '/login';
            } catch (err) {
                console.error('Logout error:', err);
                window.location.href = '/login';
            }
        }
    </script>
</body>
</html>
